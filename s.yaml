edition: 3.0.0
name: paopao
access: default
vars:
  region: cn-hangzhou
resources:
  paopao:
    component: fc3
    props:
      region: ${vars.region}
      functionName: paopao-web
      description: 泡泡选片 — 静态站 + 智谱聊天代理
      runtime: custom.debian10
      timeout: 90
      memorySize: 1024
      cpu: 0.5
      diskSize: 512
      instanceConcurrency: 8
      internetAccess: true
      layers:
        - acs:fc:${vars.region}:official:layers/Nodejs20/versions/1
      environmentVariables:
        PATH: /opt/nodejs20/bin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
        NODE_ENV: production
        ZHIPU_API_KEY: ${env(ZHIPU_API_KEY)}
        ZHIPU_MODEL: glm-5.3-flashx
        ZHIPU_BASE_URL: https://open.bigmodel.cn/api/paas/v4
      customRuntimeConfig:
        command:
          - /opt/nodejs20/bin/node
        args:
          - /code/server/fc.mjs
        port: 9000
      code: ./paopao
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
              - OPTIONS
