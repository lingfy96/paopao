<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f13" />
    <meta name="description" content="泡泡选片 PAOPAO SELECT · 今晚的好故事，藏在下一张卡里。按住泡泡，啵一声开出今晚的电影。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>泡泡选片 PAOPAO SELECT · 今晚的好故事</title>
    <style>
      html,body{margin:0;background:#0e0f13}
      html[data-theme='light'],html[data-theme='light'] body{background:#f6f2fb}
    </style>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('theme') || '"dark"');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
